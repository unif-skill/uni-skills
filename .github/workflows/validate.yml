name: Validate and release skills
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.12
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz actionlint
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Test repository maintenance tools
        run: python3 -m unittest discover -s tests -v
      - name: Validate plugin and adopted release tools
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python -m scripts.validate_repository --release-tag "$RELEASE_TAG"
          else
            python -m scripts.validate_repository
          fi
      - name: Verify self-contained RN quality copies
        run: python scripts/sync_rn_quality.py --check
      - name: Install RN quality validation tools
        run: npm ci --prefix tests/fixtures/rn-quality --ignore-scripts --no-audit --no-fund
      - name: Verify RN rules and real commit hooks
        run: node --test tests/rn-quality.test.cjs
      - name: Validate delivery implementation
        run: bash skills/uni-github-delivery/scripts/validate.sh

  release:
    name: Release skills
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Configure release commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare and validate authorized version
        id: prepare
        run: python -m scripts.prepare_release
      - name: Publish prepared version
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.prepare.outputs.commit }}
        run: python -m scripts.publish_release
