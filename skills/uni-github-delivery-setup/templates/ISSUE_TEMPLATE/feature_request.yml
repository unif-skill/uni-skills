# 目标路径:.github/ISSUE_TEMPLATE/feature_request.yml
# 由 uni-github-delivery-setup/templates/ 同步而来 —— 这是「基础版」。占位符:{{REPO}} → repo 名。
# sync-repo.sh 仅在目标仓【不存在】 feature_request.yml 时创建,不覆盖已有的
# (各仓可写 repo 特化的字段 / 示例,如 camera 的相机 API 示例)。
name: ✨ Feature request
description: 范围明确的功能需求或 API 改进。尚需讨论的想法请先提交 Discussion。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        # Feature request

        👋 Hi!

        此模板用于**范围明确的功能需求或 API 改进**，请说明涉及的模块、接口与用法。

        尚需明确范围或征求意见的想法，请先提交 [Discussion](https://github.com/{{OWNER}}/{{REPO}}/discussions/new?category=ideas)。

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 你想解决什么问题？现有替代方案是什么，为什么无法满足需求？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 具体提议
      description: 建议增加哪些 API？相关 props、方法名称、类型与用法示例是什么？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的备选
      description: 是否考虑过其他方案？（可选）

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 这项变更会影响现有 API 的兼容性吗？
      options:
        - 完全向后兼容(只加新 API)
        - 修改默认行为(可能影响现有用法)
        - Breaking change(major bump)
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: 我已搜索现有 Issue 和 Discussion
          required: true
        - label: 这是**具体可实施**且范围明确的需求
          required: true
        - label: 我已阅读本仓库的贡献与交付说明
          required: false
