# 目标路径:.github/workflows/release.yml
# 由 uni-github-delivery-setup/templates/ 同步而来 —— 各仓统一版本,不要单仓 drift。
#
# 占位符(sync-repo.sh 替换):
#   {{REPO}}      → repo 名(如 react-native-design)
#   下方 on.push.paths 里的 RELEASE_PATHS 标记由脚本按目标仓有无 *.podspec 注入:
#   native 仓(有 *.podspec)含 src/ios/android/podspec,纯 JS 仓含 src/scripts。
#   故意不含 package.json/yarn.lock —— 加 website workspace / 升依赖会连带改根 package.json+yarn.lock,
#   纯 docs/website/依赖变更不该触发发版;要发依赖升级版走手动 workflow_dispatch。
name: Release

# main 指定路径的 push 或手动 workflow_dispatch 触发；手动可选择仅核验已发布版本。
# 发布时运行 `release-it --ci`:bump 版本号 → 生成 changelog → git commit + tag →
# `npm publish`(走 npm Trusted Publishing / OIDC)→ 创建 GitHub Release。
#
# 两套凭据,各管一段:
#   1. npm publish —— Trusted Publishing / OIDC(id-token: write),无 long-lived token。
#      前置:npmjs.com 包 Settings → Trusted Publishers 绑 {{OWNER}}/{{REPO}} 的 release.yml。
#   2. git push commit + tag 回 main —— 自建 App bot 的临时 token。
#      main 受 `protect main` ruleset 保护(必须走 PR),而 github-actions[bot] 加不进 ruleset
#      bypass(它不是"安装的 App")。所以用 工程已配置的 GitHub App 生成 ~1h 过期的
#      installation token 替代 GITHUB_TOKEN,该 App 加进 ruleset bypass list → release-it 的
#      `chore: release X.Y.Z` commit 能合法推回受保护的 main。
#      前置:repo variable RELEASE_APP_ID + secret RELEASE_APP_PRIVATE_KEY + App 进 bypass list。
#
# 重复发布保护：push 路径排除版本清单，release commit 使用 [skip ci]；
# release 作业还会跳过以 "chore: release" 开头的 push 提交。

on:
  push:
    branches: [main]
    paths:
      # 只在库源码改动时触发;改 docs / website / 依赖锁 / example / CI 配置不触发发版。
      # 不含 package.json/yarn.lock —— website workspace 登记 + 依赖升级都改它们,不该触发 release。
      # release-it 看 conventional commits 决定要不要发 + bump,这层 paths 只是省 CI、不是行为兜底。
      {{RELEASE_PATHS}}
  workflow_dispatch:
    inputs:
      increment:
        description: '版本类型(auto = 走 conventional commits 自动推断)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      verify_only:
        description: '仅核验已发布版本并刷新文档，不发新版，忽略版本类型'
        required: false
        default: false
        type: boolean

concurrency:
  # 同一工作流串行执行，避免并发操作相同版本或标签。
  # cancel-in-progress: false：不因新运行取消进行中的发布。
  # group 用 ${{ github.workflow }}(=本 workflow 名,唯一)而非静态串,避免跟别的 workflow 撞同名并发组。
  group: ${{ github.workflow }}
  cancel-in-progress: false

# workflow 级零授权 —— 权限收窄到真正需要的 release job(显式最小权限边界)。
permissions: {}

jobs:
  release:
    outputs:
      revision: ${{ steps.publication.outputs.revision }}
      version: ${{ steps.publication.outputs.version }}
    permissions:
      contents: write     # 兜底;实际 push 走下面的 App token(GITHUB_TOKEN 进不了受保护 main)
      id-token: write     # npm Trusted Publishing(OIDC)+ provenance attestations
    # 兜底防自触发循环:push 上来的若是 release-it 自己推的 "chore: release" commit 直接 skip。
    # 主防线是该 commit 带 [skip ci](push 会被 Actions 跳过);这里是第二道,防 [skip ci] 失效。
    # workflow_dispatch 无 head_commit,前半条件 true 短路 → 手动发版照常,不受影响。
    if: "${{ !inputs.verify_only && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release')) }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout for publication preflight
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check public publication prerequisites
        run: node .github/scripts/check-library.cjs release

      - name: Resolve release identity
        id: release-identity
        env:
          CONFIGURED_APP_ID: ${{ vars.RELEASE_APP_ID }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { readOrganization } = require('./.github/scripts/organization.cjs');
          const policy = readOrganization(process.cwd(), process.env.REPOSITORY);
          const variable = process.env.CONFIGURED_APP_ID;
          if (policy?.releaseAppId && variable && String(policy.releaseAppId) !== variable) {
            throw new Error('Release App variable differs from adopted organization identity');
          }
          const id = String(policy?.releaseAppId || variable || '');
          if (!/^[1-9][0-9]*$/.test(id)) throw new Error('A verified release App ID is required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `app_id=${id}\n`);
          NODE

      # 生成 App bot 临时 token —— 替代 GITHUB_TOKEN,使后续 git push 能 bypass `protect main`。
      # token scope 自动限定到本 repo,权限继承 App(Contents: write),~1h 过期。
      - name: Generate App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ steps.release-identity.outputs.app_id }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0                                # release-it 要全历史算 conventional-changelog
          token: ${{ steps.app-token.outputs.token }}   # 用 App token,后续 git push 才能 bypass ruleset

      - name: Setup
        uses: ./.github/actions/setup

      # npm Trusted Publishing 需要 npm CLI ≥ 11.5.1,不能仅依赖 .nvmrc 中 Node 附带的 npm。
      # 限定 11.x,避免 npm@latest 的 engines 要求越过工程采用的 Node 版本。
      # 调整 npm 范围时同时核对 OIDC 下限与 .nvmrc 的兼容性。
      - name: Upgrade npm CLI (required for OIDC)
        run: npm install -g "npm@^11"

      - name: Verify
        run: |
          yarn lint
          yarn check:format
          yarn typecheck
          yarn test --maxWorkers=2
          yarn prepare
          node .github/scripts/check-library.cjs pack

      - name: Record current version
        id: before-release
        run: printf 'version=%s\n' "$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # commit author 用 App bot 身份(release commit 显示 verified + 归属工程发布 App bot)。
      # bot 的 numeric user id 用 app-slug 反查,拼成 GitHub no-reply 邮箱。
      - name: Resolve App bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # 经 env 传入,不把 ${{ }} 直接插值进 run 脚本 —— GitHub 官方防 shell 注入最佳实践
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          uid=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${uid}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Configure git
        env:
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

      # npm CLI 在 GitHub Actions OIDC 环境下(id-token: write + 包配过 Trusted Publisher)
      # 自动用临时 token publish,不需要写 ~/.npmrc。
      # GITHUB_TOKEN 这里换成 App token —— release-it 的 git push(commit + tag)和建 GitHub Release 都走它。
      # push 与手动 auto 均须核验推断版本；预判失败、无版本或跨 major 时停止。
      # 只有 workflow_dispatch 显式选择 major 才表示主版本授权。
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INCREMENT: ${{ inputs.increment || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          NPM_CONFIG_ACCESS: public
        run: |
          set -euo pipefail

          case "$EVENT_NAME:$INCREMENT" in
            *:auto) ;;
            workflow_dispatch:patch|workflow_dispatch:minor|workflow_dispatch:major)
              npx release-it "$INCREMENT" --ci
              exit 0
              ;;
            *)
              echo "::error::版本类型必须通过手动 workflow_dispatch 显式选择 patch、minor 或 major。"
              exit 1
              ;;
          esac

          CURRENT="$(node -p "require('./package.json').version")"
          # 严格匹配完整 SemVer，保留合法预发布标识和构建元数据。
          version_number='(0|[1-9][0-9]*)'
          prerelease_id="(${version_number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          version_pattern="^${version_number}\.${version_number}\.${version_number}(-${prerelease_id}(\.${prerelease_id})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if ! [[ "$CURRENT" =~ $version_pattern ]]; then
            echo "::error::当前版本不是有效 SemVer，拒绝自动发布:${CURRENT}"
            exit 1
          fi

          # 预判不发布；失败或没有唯一有效版本时，不再进入发布流程。
          if ! NEXT="$(npx release-it --release-version --ci)"; then
            echo "::error::无法预判下一个版本，拒绝自动发布。"
            exit 1
          fi
          if ! [[ "$NEXT" =~ $version_pattern ]]; then
            echo "::error::下一个版本为空或不是有效 SemVer，拒绝自动发布:${NEXT}"
            exit 1
          fi

          if [ "${CURRENT%%.*}" != "${NEXT%%.*}" ]; then
            echo "::error::拒绝自动发布 major:${CURRENT} → ${NEXT}"
            echo "确认主版本升级后手动发布:"
            echo "  gh workflow run release.yml --ref main -f increment=major"
            exit 1
          fi

          # 发布已核验的具体版本，避免再次自动推断。
          npx release-it "$NEXT" --ci

      - name: Record published revision
        id: publication
        env:
          PREVIOUS_VERSION: ${{ steps.before-release.outputs.version }}
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "::error::本次没有产生新版本，不能报告 npm 发布完成。"
            exit 1
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

  verify-publication:
    needs: release
    if: "${{ always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.verify_only)) }}"
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require publication outputs
        if: needs.release.result == 'success'
        env:
          PUBLISHED_REVISION: ${{ needs.release.outputs.revision }}
          PUBLISHED_VERSION: ${{ needs.release.outputs.version }}
        run: test -n "$PUBLISHED_REVISION" && test -n "$PUBLISHED_VERSION"

      - name: Checkout published revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release.outputs.revision || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Verify actual npm publication
        env:
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -n "$EXPECTED_VERSION" ]; then
            test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          fi
          node .github/scripts/check-library.cjs published

      # 发版成功后显式触发文档部署 —— dispatch 跑 main。
      # 使用 main 上的 workflow_dispatch,避免 release 标签 ref 与只允许 main 的 Pages 环境策略冲突。
      # workflow_dispatch 可由 GITHUB_TOKEN 触发新 run。文档站是公开交付前置,dispatch 失败必须报告。
      - name: Trigger docs deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-docs.yml --ref main
          echo "已触发文档部署；部署结果由 Deploy Docs 验证。"
